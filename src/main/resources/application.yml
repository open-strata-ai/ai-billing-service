openstrata:
  service:
    port: 8084
  features:
    billing:
      enabled: true
    budget-alert:
      enabled: true
      threshold: 0.8
    showback:
      enabled: true
    dev-mode:
      enabled: false
  pricing:
    token_input: 2
    token_output: 6
    gpu_hour: 15
    vector_1m: 0.5
    doc_gb: 0.1
    api_10k: 0.5
  spi:
    auth: keycloak
    cache: redis
    metering:
      - ai-gateway-core
      - opencost

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/billing
    username: billing
    password: billing
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: prod
  autoconfigure:
    exclude:  # Enable Redis in prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/billing}
    username: ${DATABASE_USER:billing}
    password: ${DATABASE_PASSWORD:billing}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

---
spring:
  config:
    activate:
      on-profile: offline
  # Offline profile: boot with an embedded H2 datasource so the service runs
  # with no external Postgres/Redis (parity with ai-admin-service).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:billing;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
