# Offline test profile: H2 in-memory backs JPA so `mvn test` needs no live PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:billing;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

openstrata:
  features:
    billing:
      enabled: true
    dev-mode:
      # Dev mode mints tenant_id=local platform-admin so the AuthInterceptor is a no-op for tests.
      enabled: true
  pricing:
    token_input: 2
    token_output: 6
    gpu_hour: 15
    vector_1m: 0.5
    doc_gb: 0.1
    api_10k: 0.5
